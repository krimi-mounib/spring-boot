spring.application.name=mohamedmounibkrimiCCE11

# Connexion a la base de donnees (mot de passe via variable d'environnement DB_PASSWORD, vide par defaut)
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.mohamedmounibkrimicce11=INFO
server.port=8081
# API REST and OpenAPI
server.servlet.context-path=/api
springdoc.swagger-ui.path=/swagger-ui.html
spring.jackson.serialization.fail-on-empty-beans=false
