spring.application.name=autoloc-atelier5

# Base de donnees MySQL. Definir DB_USERNAME / DB_PASSWORD dans l'environnement si besoin.
spring.datasource.url=jdbc:mysql://localhost:3306/autoloc_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.fail-on-empty-beans=false

logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.mohamedmounibkrimicce11=INFO
server.port=8080
server.servlet.context-path=/api
springdoc.swagger-ui.path=/swagger-ui.html
